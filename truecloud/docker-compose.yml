# Produktionsbetrieb auf einem Server (z. B. OVHcloud VPS):
#   cp .env.example .env   # ausfüllen
#   docker compose up -d --build
#
# Caddy holt automatisch ein HTTPS-Zertifikat für truecloud.online, sobald die
# DNS-Einträge (A/AAAA) auf den Server zeigen.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: truecloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: truecloud
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U truecloud']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://truecloud:${POSTGRES_PASSWORD}@db:5432/truecloud
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Stündlicher Aufräumjob (abgebrochene Uploads, Papierkorb nach 30 Tagen, alte Sitzungen)
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET in .env setzen}
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'sleep 60; while true; do curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/cleanup; echo; sleep 3600; done'
    depends_on:
      - app

volumes:
  db-data:
  caddy-data:
  caddy-config:
