name: PrioPilot (Windows-App)

on:
  push:
    paths:
      - 'prio-pilot/**'
      - '.github/workflows/priopilot.yml'
  pull_request:
    paths:
      - 'prio-pilot/**'
      - '.github/workflows/priopilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bauen-und-testen:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bauen (mit dem in Windows eingebauten Compiler)
        working-directory: prio-pilot
        shell: cmd
        run: build.bat /nopause

      - name: Selbsttest (pausieren, bremsen, Vorrang, Zurücksetzen, Oberfläche)
        working-directory: prio-pilot
        shell: pwsh
        timeout-minutes: 4
        run: |
          $p = Start-Process -FilePath .\PrioPilot.exe -ArgumentList '/selbsttest' -PassThru
          $done = $p.WaitForExit(180000)
          if (Test-Path .\selbsttest.log) { Get-Content .\selbsttest.log } else { Write-Host 'Kein selbsttest.log gefunden' }
          if (-not $done) { Stop-Process -Id $p.Id -Force; Write-Host 'Selbsttest hat sich aufgehaengt'; exit 1 }
          exit $p.ExitCode

      - name: Fertige App zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PrioPilot
          path: |
            prio-pilot/PrioPilot.exe
            prio-pilot/README.md
