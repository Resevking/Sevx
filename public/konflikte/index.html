<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konflikte der Welt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktiver 3D-Globus mit den bewaffneten Konflikten der Welt, heute und auf einer Zeitreise zurück bis 1900.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: Globus füllt den Bildschirm. Desktop: Lagebild-Panel links, Zeitleiste unten.
     Handy: Zeitleiste oben, Panel als Sheet unten, Globus dazwischen. */
  :root {
    --space: #04060b;
    --panel: rgba(9, 12, 19, 0.80);
    --panel-solid: #0a0e16;
    --raise: rgba(255, 255, 255, 0.05);
    --raise-2: rgba(255, 255, 255, 0.10);
    --line: rgba(200, 214, 236, 0.11);
    --fg: #e8ecf3;
    --soft: #cdd4df;
    --muted: #97a2b5;
    --faint: #5f6a7c;
    --focus: #8cc8ff;
    --time: #8cc8ff;
    --war: #ff4a5a;
    --civil: #ff9136;
    --insurg: #f2c94c;
    --crime: #b58cff;
    --colonial: #4fd1c5;
    --f-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --panel-w: 384px;
    --edge-l: max(16px, env(safe-area-inset-left, 0px));
    --edge-r: max(16px, env(safe-area-inset-right, 0px));
    --edge-t: max(16px, env(safe-area-inset-top, 0px));
    --edge-b: max(16px, env(safe-area-inset-bottom, 0px));
    color-scheme: dark;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--fg);
    font-family: var(--f-body);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; height: 100%; }
  #globe { position: absolute; inset: 0; }
  #globe canvas { outline: none; }
  .glass {
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid var(--line);
  }

  /* ---------- Panel ---------- */
  #panel {
    position: absolute; z-index: 5;
    top: var(--edge-t); bottom: var(--edge-b); left: var(--edge-l);
    width: var(--panel-w);
    display: flex; flex-direction: column;
    border-radius: 14px; overflow: hidden;
  }
  .ph { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .eyebrow {
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); display: flex; align-items: center; gap: 8px;
  }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--war); animation: live 2s infinite; }
  .clock { width: 12px; height: 12px; color: var(--time); flex: none; }
  @keyframes live { 0% { box-shadow: 0 0 0 0 rgba(255,74,90,.55); } 70% { box-shadow: 0 0 0 8px rgba(255,74,90,0); } 100% { box-shadow: 0 0 0 0 rgba(255,74,90,0); } }
  h1 {
    margin: 0; font-family: var(--f-display); font-stretch: 78%; font-weight: 800;
    font-size: 34px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; text-wrap: balance;
  }
  .stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .stat b { display: block; font-family: var(--f-display); font-stretch: 85%; font-weight: 700; font-size: 22px; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: var(--raise); color: var(--fg);
    font: 500 12px/1 var(--f-body); padding: 7px 10px 7px 8px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: background .15s, opacity .15s;
  }
  .chip:hover { background: var(--raise-2); }
  .chip[aria-pressed="false"] { opacity: .45; }
  .chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px currentColor; }
  .chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip .n.zero { color: var(--faint); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; min-height: 0; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }

  /* ---------- Liste ---------- */
  .group-h {
    position: sticky; top: 0; z-index: 1; padding: 10px 20px 6px;
    background: linear-gradient(var(--panel-solid) 70%, rgba(10,14,22,0));
    font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
    display: flex; align-items: center; gap: 8px;
  }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; }
  .bars i { display: block; width: 3px; border-radius: 1px; background: currentColor; opacity: .25; }
  .bars i:nth-child(1) { height: 5px; } .bars i:nth-child(2) { height: 8px; } .bars i:nth-child(3) { height: 11px; }
  .bars[data-l="1"] i:nth-child(-n+1), .bars[data-l="2"] i:nth-child(-n+2), .bars[data-l="3"] i:nth-child(-n+3) { opacity: 1; }
  .item {
    appearance: none; width: 100%; text-align: left; background: none; border: 0; color: inherit; cursor: pointer;
    display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: center; padding: 9px 20px; font: inherit;
  }
  .item:hover { background: var(--raise); }
  .item .mk { grid-row: span 2; justify-self: center; position: relative; width: 14px; height: 14px; }
  .item .mk::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--c); }
  .item .mk::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--c); opacity: .5; }
  .item .nm { font-weight: 600; font-size: 14px; line-height: 1.25; min-width: 0; }
  .item .st { grid-column: 2; font-size: 12px; color: var(--muted); min-width: 0; }
  .item .yr { grid-row: 1 / span 2; grid-column: 3; font-family: var(--f-mono); font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .empty { padding: 24px 20px; color: var(--muted); margin: 0; }

  /* ---------- Detail ---------- */
  .detail-in { padding: 14px 20px 22px; display: grid; gap: 14px; }
  .back {
    appearance: none; background: none; border: 0; color: var(--muted); font: 500 13px var(--f-body);
    padding: 4px 0; cursor: pointer; justify-self: start;
  }
  .back:hover { color: var(--fg); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px/1 var(--f-body);
    padding: 6px 9px; border-radius: 6px; background: var(--raise); border: 1px solid var(--line); color: var(--fg);
  }
  .tag.type { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .tag .bars { color: var(--c); }
  .tag.yrs { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .d-title { margin: 0; font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 30px; line-height: 1.02; text-wrap: balance; }
  .coords { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .lead { margin: 0; font-size: 15px; line-height: 1.55; }
  .sec { display: grid; gap: 6px; }
  .sec h3 { margin: 0; font-family: var(--f-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .sec p { margin: 0; color: var(--soft); line-height: 1.55; }
  .news { border-left: 2px solid var(--c); padding: 2px 0 2px 12px; }
  .parties { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .parties li { display: flex; gap: 8px; color: var(--soft); }
  .parties li::before { content: ""; flex: none; width: 5px; height: 5px; margin-top: 8px; border-radius: 1px; background: var(--faint); }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .rel button {
    appearance: none; cursor: pointer; font: 500 12.5px var(--f-body); color: var(--fg);
    background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 6px 11px 6px 9px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .rel button:hover { background: var(--raise-2); }
  .credits { margin: 0; padding: 14px 20px 18px; border-top: 1px solid var(--line); font-size: 11px; line-height: 1.5; color: var(--faint); }

  /* ---------- Zeitleiste ---------- */
  #timeline {
    position: absolute; z-index: 5;
    left: calc(var(--edge-l) + var(--panel-w) + 16px); right: var(--edge-r); bottom: var(--edge-b);
    border-radius: 14px; padding: 12px 16px 8px; display: grid; gap: 8px;
  }
  .tl-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .tl-year { display: grid; line-height: 1; min-width: 104px; }
  .tl-k { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
  .tl-k.past { color: var(--time); }
  #year-out { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 40px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .tl-btn {
    appearance: none; border: 1px solid var(--line); background: var(--raise); color: var(--fg); cursor: pointer;
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 999px; font: 500 12.5px var(--f-body);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  }
  .tl-btn:hover { background: var(--raise-2); }
  .tl-btn svg { width: 14px; height: 14px; }
  #play { padding: 0; width: 36px; }
  #play[aria-pressed="true"] { background: var(--fg); color: var(--space); }
  #now .m { display: none; }
  .tl-jumps { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
  .tl-jumps button {
    appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer;
    font: 500 12px var(--f-body); padding: 6px 8px; border-radius: 7px; white-space: nowrap;
  }
  .tl-jumps button:hover { color: var(--fg); background: var(--raise); }
  .tl-jumps button b { font-family: var(--f-mono); font-weight: 500; font-size: 11px; color: var(--faint); margin-left: 5px; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); margin-left: auto; flex: none; }
  .seg button { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; font: 500 12px var(--f-body); padding: 5px 9px; border-radius: 7px; }
  .seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--fg); }
  .tl-track { position: relative; height: 38px; }
  #hist { position: absolute; left: 6px; right: 6px; top: 0; width: calc(100% - 12px); height: 38px; display: block; }
  #year {
    position: absolute; left: 0; right: 0; top: 0; width: 100%; height: 38px; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent; cursor: ew-resize;
  }
  #year::-webkit-slider-runnable-track { height: 38px; background: transparent; }
  #year::-moz-range-track { height: 38px; background: transparent; }
  #year::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 12px; height: 38px; border: 0; border-radius: 3px;
    background: linear-gradient(90deg, transparent 4px, var(--fg) 4px, var(--fg) 8px, transparent 8px);
  }
  #year::-moz-range-thumb {
    width: 12px; height: 38px; border: 0; border-radius: 3px;
    background: linear-gradient(90deg, transparent 4px, var(--fg) 4px, var(--fg) 8px, transparent 8px);
  }
  #year:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .tl-ticks { position: relative; height: 13px; margin: 0 6px; font-family: var(--f-mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .tl-ticks span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .tl-ticks span:first-child { transform: none; }
  .tl-ticks span:last-child { transform: translateX(-100%); }

  /* ---------- Legende ---------- */
  .legend {
    position: absolute; z-index: 4; right: var(--edge-r); top: var(--edge-t);
    border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; color: var(--muted); max-width: 250px;
  }
  .legend .row { display: flex; align-items: center; gap: 14px; }
  .legend .lv { display: inline-flex; align-items: center; gap: 6px; }
  .legend .ring { border-radius: 50%; border: 1.5px solid var(--fg); opacity: .8; }
  .legend .t { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .legend .note { font-size: 11px; color: var(--faint); line-height: 1.4; }

  .sheet-handle { display: none; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .item:focus-visible { outline-offset: -2px; }

  /* globe.gl Tooltip */
  .float-tooltip-kap {
    background: rgba(8, 11, 18, 0.92) !important; border: 1px solid var(--line); border-radius: 8px !important;
    padding: 8px 10px !important; font: 13px/1.4 var(--f-body) !important; color: var(--fg) !important;
    max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .tt-h { font-weight: 600; }
  .tt-s { color: var(--muted); font-size: 12px; }
  .tt-r { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 3px; }

  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; pointer-events: none;
    font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
  }

  /* ---------- Mittlere Breite ---------- */
  @media (max-width: 1640px) and (min-width: 761px) {
    .tl-jumps button b { display: none; }
  }
  @media (max-width: 1240px) and (min-width: 761px) {
    .tl-jumps button[data-y="2015"] { display: none; }
  }
  @media (max-width: 1060px) and (min-width: 761px) {
    :root { --panel-w: 330px; }
    .tl-jumps { display: none; }
    .legend { display: none; }
  }

  /* ---------- Handy ---------- */
  @media (max-width: 760px) {
    #panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 44%;
      border-radius: 16px 16px 0 0; border-left: 0; border-right: 0; border-bottom: 0;
      padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .3s ease;
    }
    #panel.tall { height: 80%; }
    .sheet-handle { display: flex; justify-content: center; appearance: none; background: none; border: 0; cursor: pointer; padding: 8px 0 0; width: 100%; }
    .sheet-handle span { width: 38px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); }
    .ph { padding: 6px var(--edge-r) 12px var(--edge-l); gap: 8px; }
    h1 { font-size: 24px; }
    .stats { gap: 14px; }
    .stat b { font-size: 17px; }
    .stat span { font-size: 10.5px; }
    .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--edge-r)) 0 calc(-1 * var(--edge-l)); padding: 0 var(--edge-r) 2px var(--edge-l); }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    #panel.has-detail .stats, #panel.has-detail .filters { display: none; }
    .item, .group-h, .detail-in, .credits { padding-left: var(--edge-l); padding-right: var(--edge-r); }
    .d-title { font-size: 26px; }
    #timeline {
      left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px));
      top: max(10px, env(safe-area-inset-top, 0px)); bottom: auto;
      padding: 8px 12px 6px; gap: 6px; border-radius: 12px;
    }
    .tl-head { gap: 8px; }
    .tl-year { min-width: 72px; }
    #year-out { font-size: 28px; }
    .tl-k { font-size: 9.5px; }
    .tl-jumps { display: none; }
    .tl-btn { height: 32px; min-width: 32px; padding: 0 10px; }
    #play { width: 32px; }
    #now .d { display: none; }
    #now .m { display: inline; }
    .tl-track, #hist, #year, #year::-webkit-slider-runnable-track { height: 28px; }
    #year::-webkit-slider-thumb { height: 28px; }
    #year::-moz-range-thumb { height: 28px; }
    #year::-moz-range-track { height: 28px; }
    .tl-ticks .opt { display: none; }
    .legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .live { animation: none; }
    #panel { transition: none; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="globe" role="img" aria-label="Drehbarer 3D-Globus. Konfliktgebiete sind farbig markiert."></div>
  <div id="loading">Erde wird geladen …</div>

  <aside id="panel" class="glass" aria-label="Lagebild">
    <button class="sheet-handle" id="handle" type="button" aria-label="Liste vergrössern"><span></span></button>
    <header class="ph">
      <div class="eyebrow" id="eyebrow"></div>
      <h1>Konflikte der Welt</h1>
      <div class="stats" id="stats"></div>
      <div class="filters" id="filters" role="group" aria-label="Nach Art des Konflikts filtern"></div>
    </header>
    <div class="scroll" id="list"></div>
    <div class="scroll" id="detail" hidden></div>
  </aside>

  <section id="timeline" class="glass" aria-label="Zeitreise">
    <div class="tl-head">
      <div class="tl-year">
        <span class="tl-k" id="year-k">Heute</span>
        <output id="year-out" for="year">2026</output>
      </div>
      <button type="button" class="tl-btn" id="play" aria-pressed="false" aria-label="Zeitreise abspielen">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="play-ico" fill="currentColor" d="M4 2.5v11l9-5.5z"/></svg>
      </button>
      <button type="button" class="tl-btn" id="now" hidden><span class="d">Zurück zu heute</span><span class="m">Heute</span></button>
      <div class="tl-jumps" role="group" aria-label="Zu einer Epoche springen">
        <button type="button" data-y="1916">1. Weltkrieg<b>1916</b></button>
        <button type="button" data-y="1943">2. Weltkrieg<b>1943</b></button>
        <button type="button" data-y="1968">Kalter Krieg<b>1968</b></button>
        <button type="button" data-y="1994">Nach dem Mauerfall<b>1994</b></button>
        <button type="button" data-y="2015">Syrien & IS<b>2015</b></button>
      </div>
      <div class="seg" role="group" aria-label="Darstellung der Erde">
        <button type="button" id="tex-day" aria-pressed="true">Tag</button>
        <button type="button" id="tex-night" aria-pressed="false">Nacht</button>
      </div>
    </div>
    <div class="tl-track">
      <svg id="hist" viewBox="-0.5 0 127 38" preserveAspectRatio="none" aria-hidden="true"></svg>
      <input type="range" id="year" min="1900" max="2026" step="1" value="2026" aria-label="Jahr wählen">
    </div>
    <div class="tl-ticks" aria-hidden="true">
      <span style="left:0%">1900</span><span class="opt" style="left:11.11%">1914</span><span style="left:31.75%">1940</span><span class="opt" style="left:47.62%">1960</span><span style="left:63.49%">1980</span><span class="opt" style="left:79.37%">2000</span><span style="left:100%">2026</span>
    </div>
  </section>

  <div class="legend glass" aria-hidden="true">
    <span class="t">Grösse der Ringe</span>
    <div class="row">
      <span class="lv"><span class="ring" style="width:16px;height:16px"></span>hoch</span>
      <span class="lv"><span class="ring" style="width:11px;height:11px"></span>mittel</span>
      <span class="lv"><span class="ring" style="width:7px;height:7px"></span>niedrig</span>
    </div>
    <span class="note" id="legend-note"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script>
(function () {
  "use strict";

  /* ======================================================================
     Daten
     countries = Schauplatz (eingefärbt), involved = beteiligt (nur Umriss)
     arcs = [vonLat, vonLng, nachLat, nachLng]
     level: aktuell = Heftigkeit heute; Vergangenheit = Todesopfer
            (3: ab 100’000, 2: ab 10’000, 1: weniger)
     ====================================================================== */
  const NOW_YEAR = 2026, MIN_YEAR = 1900;

  const TYPES = {
    war:      { label: "Krieg",                long: "Krieg zwischen Staaten / grenzüberschreitend", color: "#ff4a5a" },

  NOW.forEach(c => { c.to = null; c.current = true; });
  const ALL = NOW.concat(HISTORY);

  /* ================= Zustand & Helfer ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
  const colorOf = c => TYPES[c.type].color;
  const fmtCoord = (lat, lng) => `${Math.abs(lat).toFixed(1)}° ${lat >= 0 ? "N" : "S"} · ${Math.abs(lng).toFixed(1)}° ${lng >= 0 ? "O" : "W"}`;
  const bars = l => `<span class="bars" data-l="${l}" aria-hidden="true"><i></i><i></i><i></i></span>`;
  const years = c => c.current ? `seit ${c.since}` : (c.from === c.to ? String(c.from) : `${c.from}–${c.to}`);
  const nameOf = id => NAMES[id] || id;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isMobile = () => window.matchMedia("(max-width: 760px)").matches;

  const byId = Object.fromEntries(ALL.map(c => [c.id, c]));
  const order = Object.fromEntries(ALL.map((c, i) => [c.id, i]));
  const active = new Set(Object.keys(TYPES));
  let year = NOW_YEAR;
  let selected = null;
  let hoverPoly = null;

  const theatreOf = {}, involvedOf = {};
  ALL.forEach(c => {
    c.countries.forEach(id => (theatreOf[id] = theatreOf[id] || []).push(c));
    c.involved.forEach(id => (involvedOf[id] = involvedOf[id] || []).push(c));
  });
  const activeIn = (c, y) => c.from <= y && (c.to === null || c.to >= y);
  const visible = c => active.has(c.type) && activeIn(c, year);
  const sortConf = (a, b) => b.level - a.level || order[a.id] - order[b.id];

  /* ================= Panel ================= */
  const listEl = $("#list"), detailEl = $("#detail"), panel = $("#panel");
  const CREDITS = `<p class="credits">Auswahl ohne Anspruch auf Vollständigkeit: ${NOW.length} aktuelle und ${HISTORY.length} vergangene Konflikte, Länder in heutigen Grenzen. Die Balken der Zeitleiste zeigen, wie viele davon im jeweiligen Jahr aktiv waren. Aktuelle Lage nach Crisis Group (CrisisWatch), ACLED, UNO, AP, Reuters, Al Jazeera u. a. (Stand 10. November 2026); Opferzahlen sind Schätzungen. Karten: Natural Earth · Bilder: NASA.</p>`;

  function renderHeader() {
    const past = year < NOW_YEAR;
    $("#eyebrow").innerHTML = past
      ? `<svg class="clock" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5V8l2.5 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Zeitreise · Weltlage im Jahr ${year}`
      : `<span class="live" aria-hidden="true"></span>Lagebild · Stand 10. November 2026`;
    const vis = ALL.filter(visible);
    const high = vis.filter(c => c.level === 3).length;
    const countries = new Set(vis.flatMap(c => c.countries.concat(c.involved)));
    $("#stats").innerHTML =
      `<div class="stat"><b>${vis.length}</b><span>Konflikte</span></div>` +
      `<div class="stat"><b>${high}</b><span>${past ? "grosse Kriege" : "hohe Intensität"}</span></div>` +
      `<div class="stat"><b>${countries.size}</b><span>Länder betroffen</span></div>`;
    $("#filters").innerHTML = Object.entries(TYPES).map(([k, t]) => {
      const n = ALL.filter(c => c.type === k && activeIn(c, year)).length;
      return `<button type="button" class="chip" data-type="${k}" aria-pressed="${active.has(k)}" style="color:${t.color}">` +
        `<span class="dot" style="background:${t.color}"></span><span style="color:var(--fg)">${t.label}</span><span class="n${n ? "" : " zero"}">${n}</span></button>`;
    }).join("");
    $("#legend-note").textContent = past
      ? "Vergangene Konflikte nach Todesopfern: hoch ab 100’000, mittel ab 10’000."
      : "Aktuelle Konflikte nach Heftigkeit der Kämpfe heute.";
  }

  function renderList() {
    const vis = ALL.filter(visible).sort(sortConf);
    if (!vis.length) {
      listEl.innerHTML = `<p class="empty">${active.size ? `Im Jahr ${year} ist in dieser Auswahl kein Konflikt der gewählten Arten verzeichnet.` : "Keine Kategorie ausgewählt. Tippe oben auf eine Kategorie, um Konflikte einzublenden."}</p>` + CREDITS;
      return;
    }
    let html = "";
    [3, 2, 1].forEach(l => {
      const g = vis.filter(c => c.level === l);
      if (!g.length) return;
      html += `<div class="group-h">${bars(l)}${LEVEL[l]} · ${g.length}</div>`;
      html += g.map(c => `<button type="button" class="item" data-id="${c.id}" style="--c:${colorOf(c)}">` +
        `<span class="mk" aria-hidden="true"></span><span class="nm">${esc(c.name)}</span>` +
        `<span class="yr">${esc(years(c))}</span><span class="st">${esc(TYPES[c.type].label)}${c.current ? " · " + esc(c.status) : ""}</span></button>`).join("");
    });
    listEl.innerHTML = html + CREDITS;
  }

  function renderDetail(c) {
    const p = c.points[0];
    const here = c.countries.concat(c.involved);
    const related = [...new Set(here.flatMap(id => (theatreOf[id] || []).concat(involvedOf[id] || [])))]
      .filter(x => x !== c && activeIn(x, year)).sort(sortConf);
    const where = c.countries.map(nameOf);
    const inv = c.involved.map(nameOf);
    const levelLabel = c.current ? `Intensität ${LEVEL_SHORT[c.level]}` : `Grösse ${LEVEL_SHORT[c.level]}`;
    detailEl.innerHTML = `<div class="detail-in" style="--c:${colorOf(c)}">
      <button type="button" class="back" id="back">← Alle Konflikte${year < NOW_YEAR ? " im Jahr " + year : ""}</button>
      <div class="tags">
        <span class="tag type"><span class="dot" style="background:var(--c)"></span>${esc(TYPES[c.type].long)}</span>
        <span class="tag">${bars(c.level)} ${levelLabel}</span>
        ${c.current ? `<span class="tag">${esc(c.status)}</span>` : `<span class="tag yrs">${esc(years(c))}</span>`}
      </div>
      <h2 class="d-title">${esc(c.name)}</h2>
      <div class="coords"><span>${fmtCoord(p.lat, p.lng)}</span><span>${c.current ? "seit " + esc(c.sinceLong) : esc(years(c))}</span></div>
      <p class="lead">${esc(c.lead)}</p>
      ${c.current ? `<div class="sec news"><h3>Neueste Entwicklung${year < NOW_YEAR ? " · Stand Nov. 2026" : ""}</h3><p>${esc(c.news)}</p></div>` : ""}
      ${c.parties ? `<div class="sec"><h3>Konfliktparteien</h3><ul class="parties">${c.parties.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      ${c.toll ? `<div class="sec"><h3>Opfer &amp; Folgen</h3><p>${esc(c.toll)}</p></div>` : ""}
      <div class="sec"><h3>Brennpunkte</h3><p>${c.points.map(x => esc(x.n)).join(" · ")}</p></div>
      ${where.length ? `<div class="sec"><h3>Schauplatz (heutige Grenzen)</h3><p>${where.map(esc).join(", ")}</p></div>` : ""}
      ${inv.length ? `<div class="sec"><h3>Ebenfalls beteiligt</h3><p>${inv.map(esc).join(", ")}</p></div>` : ""}
      ${related.length ? `<div class="sec"><h3>Gleichzeitig in diesen Ländern</h3><div class="rel">${related.map(r =>
        `<button type="button" data-id="${r.id}"><span class="dot" style="background:${colorOf(r)}"></span>${esc(r.name)}</button>`).join("")}</div></div>` : ""}
    </div>${CREDITS}`;
  }

  function setHash(h) {
    try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) { /* Hash bleibt */ }
  }

  function showList(opts) {
    selected = null;
    detailEl.hidden = true; listEl.hidden = false;
    panel.classList.remove("has-detail");
    if (!opts || !opts.keepHash) setHash(year < NOW_YEAR ? "jahr-" + year : "");
    if (!opts || !opts.noRefresh) refreshGlobe();
  }

  function select(id, opts) {
    const c = byId[id];
    if (!c) return;
    if (!activeIn(c, year)) setYear(Math.max(MIN_YEAR, c.from), { keepSelection: true });
    if (!active.has(c.type)) { active.add(c.type); renderHeader(); renderList(); drawHist(); }
    selected = c;
    renderDetail(c);
    listEl.hidden = true; detailEl.hidden = false; detailEl.scrollTop = 0;
    panel.classList.add("has-detail");
    if (!opts || !opts.fromHash) setHash(id);
    stopPlay();
    stopRotate();
    flyTo(c);
    refreshGlobe();
  }

  $("#filters").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    const k = b.dataset.type;
    active.has(k) ? active.delete(k) : active.add(k);
    if (selected && !active.has(selected.type)) showList({ noRefresh: true });
    renderHeader(); renderList(); drawHist(); refreshGlobe();
  });
  listEl.addEventListener("click", e => { const b = e.target.closest(".item"); if (b) select(b.dataset.id); });
  detailEl.addEventListener("click", e => {
    if (e.target.closest("#back")) { showList(); return; }
    const b = e.target.closest(".rel button"); if (b) select(b.dataset.id);
  });
  $("#handle").addEventListener("click", () => {
    const tall = panel.classList.toggle("tall");
    $("#handle").setAttribute("aria-label", tall ? "Liste verkleinern" : "Liste vergrössern");
    setTimeout(() => { if (world) { layoutGlobe(); world.pointOfView({ altitude: selected ? detailAltitude() : baseAltitude() }, 300); } }, 320);
  });

  /* ================= Zeitreise ================= */
  const yearInput = $("#year"), yearOut = $("#year-out"), histEl = $("#hist");
  let playTimer = null;

  function drawHist() {
    const rows = [];
    let max = 1;
    for (let y = MIN_YEAR; y <= NOW_YEAR; y++) {
      const counts = {};
      ALL.forEach(c => { if (active.has(c.type) && activeIn(c, y)) counts[c.type] = (counts[c.type] || 0) + 1; });
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      max = Math.max(max, total);
      rows.push(counts);
    }
    const Hh = 38;
    let s = `<rect x="${year - MIN_YEAR - 0.5}" y="0" width="1" height="${Hh}" fill="rgba(255,255,255,0.10)"/>`;
    rows.forEach((counts, i) => {
      let yy = Hh;
      const cur = i === year - MIN_YEAR;
      Object.keys(TYPES).forEach(k => {
        const n = counts[k]; if (!n) return;
        const h = n / max * (Hh - 2);
        yy -= h;
        s += `<rect x="${i - 0.38}" y="${yy.toFixed(2)}" width="0.76" height="${h.toFixed(2)}" fill="${TYPES[k].color}" fill-opacity="${cur ? 1 : 0.5}"/>`;
      });
    });
    histEl.setAttribute("viewBox", `-0.5 0 ${NOW_YEAR - MIN_YEAR + 1} ${Hh}`);
    histEl.innerHTML = s;
  }

  function setYear(y, opts) {
    y = Math.max(MIN_YEAR, Math.min(NOW_YEAR, Math.round(y)));
    const keep = !!(opts && opts.keepSelection);
    const changedEra = (y < NOW_YEAR) !== (year < NOW_YEAR);
    year = y;
    yearInput.value = String(y);
    yearInput.setAttribute("aria-valuetext", y === NOW_YEAR ? "Heute, 2026" : String(y));
    yearOut.textContent = String(y);
    const k = $("#year-k");
    k.textContent = y === NOW_YEAR ? "Heute" : "Zeitreise";
    k.classList.toggle("past", y < NOW_YEAR);
    $("#now").hidden = y === NOW_YEAR;
    if (!keep) {
      if (selected && !activeIn(selected, y)) showList({ noRefresh: true, keepHash: true });
      if (selected) renderDetail(selected);
      else setHash(y < NOW_YEAR ? "jahr-" + y : "");
    }
    renderHeader(); renderList(); drawHist();
    if (changedEra) applyTexture();
    refreshGlobe();
  }

  function stopPlay() {
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    const b = $("#play");
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", "Zeitreise abspielen");
    $("#play-ico").setAttribute("d", "M4 2.5v11l9-5.5z");
  }
  function startPlay() {
    if (selected) showList({ noRefresh: true });
    if (year >= NOW_YEAR) setYear(MIN_YEAR);
    const b = $("#play");
    b.setAttribute("aria-pressed", "true");
    b.setAttribute("aria-label", "Zeitreise anhalten");
    $("#play-ico").setAttribute("d", "M4 2.5h3v11H4zM9 2.5h3v11H9z");
    playTimer = setInterval(() => {
      if (year >= NOW_YEAR) { stopPlay(); return; }
      setYear(year + 1);
      if (year >= NOW_YEAR) stopPlay();
    }, 520);
  }

  yearInput.addEventListener("input", () => { stopPlay(); setYear(+yearInput.value); });
  $("#play").addEventListener("click", () => (playTimer ? stopPlay() : startPlay()));
  $("#now").addEventListener("click", () => { stopPlay(); setYear(NOW_YEAR); });
  $(".tl-jumps").addEventListener("click", e => {
    const b = e.target.closest("button[data-y]"); if (!b) return;
    stopPlay(); if (selected) showList({ noRefresh: true }); setYear(+b.dataset.y);
  });

  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    const m = /^jahr-(\d{4})$/.exec(h);
    if (m) { if (selected) showList({ noRefresh: true, keepHash: true }); setYear(+m[1]); return; }
    if (byId[h]) { if (!selected || selected.id !== h) select(h, { fromHash: true }); }
    else if (selected) showList();
  });

  /* ================= Globus ================= */
  let world = null;
  let applyTexture = () => {};
  let layoutGlobe = () => {};
  let baseAltitude = () => 2.2;
  let detailAltitude = () => 1.5;
  function stopRotate() { if (world) world.controls().autoRotate = false; }
  function refreshGlobe() { if (world) { refreshPolygons(); refreshLayers(); } }
  function flyTo(c) {
    if (!world) return;
    const p = c.points[0];
    world.pointOfView({ lat: p.lat, lng: p.lng, altitude: detailAltitude() }, reduceMotion ? 0 : 1300);
  }

  renderHeader(); renderList(); drawHist();

  const globeEl = $("#globe");
  if (typeof Globe === "undefined") {
    $("#loading").textContent = "Der 3D-Globus konnte nicht geladen werden. Liste und Zeitreise funktionieren trotzdem.";
    return;
  }

  world = new Globe(globeEl, { animateIn: !reduceMotion })
    .backgroundImageUrl("stars.jpg")
    .globeImageUrl("earth-day.jpg")
    .bumpImageUrl("earth-bump.jpg")
    .showAtmosphere(true)
    .atmosphereColor("#7fb2ff")
    .atmosphereAltitude(0.17)
    .onGlobeReady(() => { $("#loading").hidden = true; });

  const allPoints = ALL.flatMap(c => c.points.map((p, i) => ({ c, p, primary: i === 0, lat: p.lat, lng: p.lng })));
  const allArcs = ALL.flatMap(c => c.arcs.map(a => ({ c, startLat: a[0], startLng: a[1], endLat: a[2], endLng: a[3] })));

  function tipConflict(c, place) {
    return `<div class="tt-h">${esc(c.name)}</div>` + (place ? `<div class="tt-s">${esc(place)}</div>` : "") +
      `<div class="tt-r"><span class="dot" style="background:${colorOf(c)}"></span>${esc(TYPES[c.type].label)} · ${esc(c.current ? c.status : years(c))}</div>`;
  }

  // Pro Aktualisierung einmal berechnen: Land → sichtbare Konflikte
  let polyCache = {};
  function buildPolyCache() {
    polyCache = {};
    const add = (key, id, c) => { const o = polyCache[id] || (polyCache[id] = { th: [], inv: [] }); o[key].push(c); };
    ALL.forEach(c => {
      if (!visible(c)) return;
      c.countries.forEach(id => add("th", id, c));
      c.involved.forEach(id => add("inv", id, c));
    });
    Object.values(polyCache).forEach(o => { o.th.sort(sortConf); o.inv.sort(sortConf); });
  }
  const EMPTY = { th: [], inv: [] };
  const info = f => polyCache[f.id] || EMPTY;

  function refreshPolygons() {
    buildPolyCache();
    const sel = selected;
    const selCountries = new Set(sel ? sel.countries : []);
    const selInvolved = new Set(sel ? sel.involved : []);
    world
      .polygonAltitude(f => {
        const { th, inv } = info(f);
        let a = th.length ? 0.009 : 0.004;
        if (selCountries.has(f.id)) a = 0.028;
        if (f === hoverPoly && (th.length || inv.length)) a += 0.01;
        return a;
      })
      .polygonCapColor(f => {
        const top = info(f).th[0];
        if (selCountries.has(f.id)) return rgba(colorOf(sel), 0.72);
        if (!top) return "rgba(0,0,0,0)";
        const alpha = [0, 0.26, 0.4, 0.55][top.level] * (sel ? 0.55 : 1);
        return rgba(colorOf(top), f === hoverPoly ? Math.min(alpha + 0.2, 0.8) : alpha);
      })
      .polygonSideColor(f => {
        const top = info(f).th[0];
        if (selCountries.has(f.id)) return rgba(colorOf(sel), 0.35);
        return top ? rgba(colorOf(top), 0.18) : "rgba(0,0,0,0)";
      })
      .polygonStrokeColor(f => {
        const { th, inv } = info(f);
        if (selCountries.has(f.id) || selInvolved.has(f.id)) return rgba(colorOf(sel), 1);
        if (th[0]) return rgba(colorOf(th[0]), sel ? 0.5 : 0.9);
        if (inv[0]) return rgba(colorOf(inv[0]), sel ? 0.35 : 0.75);
        return "rgba(220,230,245,0.14)";
      })
      .polygonLabel(f => {
        const { th, inv } = info(f);
        if (!th.length && !inv.length) return "";
        let h = `<div class="tt-h">${esc(nameOf(f.id))}${year < NOW_YEAR ? ` · ${year}` : ""}</div>`;
        th.forEach(c => { h += `<div class="tt-r"><span class="dot" style="background:${colorOf(c)}"></span>${esc(c.name)}</div>`; });
        inv.forEach(c => { h += `<div class="tt-r"><span class="dot" style="box-shadow:inset 0 0 0 1.5px ${colorOf(c)}"></span>beteiligt: ${esc(c.name)}</div>`; });
        return h;
      });
  }

  function refreshLayers() {
    const sel = selected;
    const pts = allPoints.filter(d => visible(d.c));
    world
      .pointsData(pts)
      .pointColor(d => (sel && d.c !== sel) ? rgba(colorOf(d.c), 0.45) : colorOf(d.c))
      .pointAltitude(d => d.c === sel ? 0.06 : 0.015)
      .pointRadius(d => (d.c === sel ? 0.55 : 0.28 + d.c.level * 0.07))
      .pointLabel(d => tipConflict(d.c, d.p.n));
    world.ringsData(reduceMotion ? [] : pts.filter(d => d.primary || d.c.level >= 2 || d.c === sel));
    world
      .arcsData(allArcs.filter(d => visible(d.c) && (!sel || d.c === sel)))
      .arcColor(d => [rgba(colorOf(d.c), 0.15), rgba(colorOf(d.c), 0.95)])
      .arcStroke(d => d.c === sel ? 0.9 : 0.45)
      .arcLabel(d => tipConflict(d.c, "Angriff oder Unterstützung von aussen"));
  }

  world
    .polygonsTransitionDuration(reduceMotion ? 0 : 250)
    .pointsMerge(false)
    .pointResolution(16)
    .ringColor(d => t => rgba(colorOf(d.c), Math.max(0, 0.85 * (1 - t))))
    .ringMaxRadius(d => (d.c === selected ? 5 : 1.4 + d.c.level * 1.1))
    .ringPropagationSpeed(d => 1 + d.c.level * 0.4)
    .ringRepeatPeriod(d => 2400 - d.c.level * 350)
    .ringAltitude(0.012)
    .arcAltitude(d => {
      // Bogenhöhe mit der Distanz, aber gedeckelt, damit Langstreckenbögen nicht ins All ragen
      const r = Math.PI / 180;
      const cos = Math.sin(d.startLat * r) * Math.sin(d.endLat * r) +
        Math.cos(d.startLat * r) * Math.cos(d.endLat * r) * Math.cos((d.endLng - d.startLng) * r);
      return Math.min(0.32, 0.35 * Math.acos(Math.max(-1, Math.min(1, cos))));
    })
    .arcDashLength(0.45)
    .arcDashGap(0.25)
    .arcDashInitialGap(() => Math.random())
    .arcDashAnimateTime(reduceMotion ? 0 : 2600)
    .onPolygonHover(f => { hoverPoly = f || null; refreshPolygons(); })
    .onPolygonClick(f => { const o = info(f); const c = o.th[0] || o.inv[0]; if (c) select(c.id); })
    .onPointClick(d => select(d.c.id))
    .onArcClick(d => select(d.c.id))
    .onGlobeClick(() => { if (selected) showList(); });

  fetch("countries.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(geo => { world.polygonsData(geo.features); refreshGlobe(); })
    .catch(() => { refreshGlobe(); });

  const controls = world.controls();
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;
  globeEl.addEventListener("pointerdown", stopRotate);
  globeEl.addEventListener("wheel", stopRotate, { passive: true });

  // Freier Bereich für den Globus (ohne Panel und Zeitleiste)
  function freeArea() {
    const W = window.innerWidth, Hh = window.innerHeight;
    const pr = panel.getBoundingClientRect(), tr = $("#timeline").getBoundingClientRect();
    if (isMobile()) return { l: 0, r: W, t: tr.bottom, b: pr.top, W, H: Hh };
    return { l: pr.right, r: W, t: 0, b: tr.top, W, H: Hh };
  }
  layoutGlobe = () => {
    const a = freeArea();
    world.width(a.W).height(a.H);
    world.globeOffset([(a.l + a.r) / 2 - a.W / 2, (a.t + a.b) / 2 - a.H / 2]);
  };
  // Kamerahöhe so wählen, dass der Globus den freien Bereich zu ~80 % füllt
  baseAltitude = () => {
    const a = freeArea();
    const targetR = Math.max(60, Math.min(a.r - a.l, a.b - a.t)) * 0.41;
    const fov = (world.camera().fov || 50) * Math.PI / 180;
    const theta = Math.atan(targetR / (a.H / 2) * Math.tan(fov / 2));
    return Math.min(9, Math.max(1.4, 1 / Math.sin(theta) - 1));
  };
  detailAltitude = () => Math.max(1.1, baseAltitude() * 0.68);

  let texMode = "day";
  let currentTex = "earth-day.jpg";
  applyTexture = () => {
    const url = texMode === "night" ? "earth-night.jpg" : (year < NOW_YEAR ? "earth-past.jpg" : "earth-day.jpg");
    if (url !== currentTex) { currentTex = url; world.globeImageUrl(url); }
  };
  const texBtns = { day: $("#tex-day"), night: $("#tex-night") };
  function setTex(mode) {
    texMode = mode;
    texBtns.day.setAttribute("aria-pressed", String(mode === "day"));
    texBtns.night.setAttribute("aria-pressed", String(mode === "night"));
    applyTexture();
    try { localStorage.setItem("konflikte-tex", mode); } catch (e) { /* ohne Speicher weiter */ }
  }
  texBtns.day.addEventListener("click", () => setTex("day"));
  texBtns.night.addEventListener("click", () => setTex("night"));
  try { if (localStorage.getItem("konflikte-tex") === "night") setTex("night"); } catch (e) { /* ignorieren */ }

  window.addEventListener("resize", () => layoutGlobe());
  layoutGlobe();
  world.pointOfView({ lat: 18, lng: 28, altitude: baseAltitude() }, 0);
  refreshGlobe();

  const start = location.hash.slice(1);
  const m = /^jahr-(\d{4})$/.exec(start);
  if (m) setYear(+m[1]);
  else if (byId[start]) setTimeout(() => select(start, { fromHash: true }), 400);
})();
</script>
</body>
</html>
