<!doctype html>
<html lang="de-CH" class="no-js">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <script>
            document.documentElement.classList.replace('no-js', 'js');
        </script>

        <title>r2sev – Twitch Streamer &amp; YouTuber</title>
        <meta name="description" content="r2sev – Twitch Streamer &amp; YouTuber. Alle Links an einem Ort: Twitch, YouTube und Kontakt." />
        <meta name="theme-color" content="#080606" />
        <link rel="canonical" href="https://r2sev.com/" />

        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://r2sev.com/" />
        <meta property="og:title" content="r2sev – Twitch Streamer &amp; YouTuber" />
        <meta property="og:description" content="Alle Links an einem Ort: Twitch, YouTube und Kontakt." />
        <meta property="og:image" content="https://r2sev.com/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:locale" content="de_CH" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

        <link rel="preload" href="/fonts/outfit-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="/css/style.css" />
        <script src="/js/main.js" defer></script>
    </head>
    <body>
        <div class="backdrop" aria-hidden="true"></div>

        <main class="page">
            <header class="profile">
                <div class="avatar" aria-hidden="true">
                    <svg class="hat" viewBox="0 0 64 64" focusable="false">
                        <ellipse class="hat__brim" cx="32" cy="46.5" rx="23" ry="6.2" />
                        <path class="hat__crown" d="M18.2 16 20 43.2Q32 48.4 44 43.2L45.8 16Z" />
                        <path class="hat__band" d="M19.6 36.6Q32 41.4 44.4 36.6L44.15 40.6Q32 45.4 19.85 40.6Z" />
                        <ellipse class="hat__top" cx="32" cy="16" rx="13.8" ry="3.6" />
                    </svg>
                </div>
                <h1 class="profile__name">r2sev</h1>
                <p class="profile__tagline">Twitch Streamer &amp; YouTuber</p>
            </header>

            <div class="links">
                <svg class="watermark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
                    <ellipse cx="32" cy="46.5" rx="23" ry="6.2" />
                    <path d="M18.2 16 20 43.2Q32 48.4 44 43.2L45.8 16Z" />
                    <ellipse cx="32" cy="16" rx="13.8" ry="3.6" />
                </svg>

                <ul class="links__list" role="list">
                    <li>
                        <a class="card card__row" href="https://www.twitch.tv/r2sev" target="_blank" rel="noopener noreferrer">
                            <span class="tile tile--twitch" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path fill="currentColor" d="M6 0 1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0Z" />
                                    <path fill="var(--twitch-bg)" d="M11.571 4.714h1.715v5.143h-1.715zm4.715 0H18v5.143h-1.714z" />
                                </svg>
                            </span>
                            <span class="card__text">
                                <span class="card__title">Twitch</span>
                                <span class="card__sub">twitch.tv/r2sev</span>
                            </span>
                            <span class="card__action" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                </svg>
                            </span>
                            <span class="sr-only">(öffnet in neuem Tab)</span>
                        </a>
                    </li>
                    <li>
                        <a class="card card__row" href="https://www.youtube.com/@r2sev" target="_blank" rel="noopener noreferrer">
                            <span class="tile tile--youtube" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path
                                        fill="currentColor"
                                        d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814Z"
                                    />
                                    <path fill="var(--youtube-bg)" d="M9.545 15.568V8.432L15.818 12z" />
                                </svg>
                            </span>
                            <span class="card__text">
                                <span class="card__title">YouTube</span>
                                <span class="card__sub">youtube.com/@r2sev</span>
                            </span>
                            <span class="card__action" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                                </svg>
                            </span>
                            <span class="sr-only">(öffnet in neuem Tab)</span>
                        </a>
                    </li>
                    <li class="card contact" id="kontakt" data-contact>
                        <button class="card__row contact__toggle" type="button" aria-expanded="false" aria-controls="kontakt-panel" data-contact-toggle>
                            <span class="tile tile--mail" aria-hidden="true">
                                <svg viewBox="0 0 24 24" focusable="false">
                                    <rect x="2" y="4.5" width="20" height="15" rx="3" fill="currentColor" />
                                    <path
                                        d="m3.5 7 8.5 6.2L20.5 7"
                                        fill="none"
                                        stroke="var(--mail-bg)"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </span>
                            <span class="card__text">
                                <span class="card__title">Kontakt</span>
                                <span class="card__sub">Nachricht direkt senden</span>
                            </span>
                            <span class="card__action" aria-hidden="true">
                                <svg class="icon-send" viewBox="0 0 24 24" focusable="false">
                                    <path
                                        fill="currentColor"
                                        stroke="none"
                                        d="M21.4 2.6a1 1 0 0 0-1.05-.23L3.1 8.6a1 1 0 0 0-.05 1.86l6.9 2.95 2.95 6.9a1 1 0 0 0 1.86-.05l6.24-17.25a1 1 0 0 0-.4-1.41Z"
                                    />
                                    <path d="m10.2 13.8 4.3-4.3" stroke="var(--chip)" stroke-width="1.8" />
                                </svg>
                                <svg class="icon-close" viewBox="0 0 24 24" focusable="false">
                                    <path d="M18 6 6 18M6 6l12 12" />
                                </svg>
                            </span>
                        </button>

                        <div class="contact__panel" id="kontakt-panel" data-contact-panel>
                            <div class="contact__panel-inner">
                                <div class="contact__body">
                                    <form
                                        class="form"
                                        name="kontakt"
                                        method="POST"
                                        action="/danke/"
                                        data-netlify="true"
                                        netlify-honeypot="bot-field"
                                        data-contact-form
                                    >
                                        <input type="hidden" name="form-name" value="kontakt" />
                                        <input type="hidden" name="subject" value="Neue Nachricht über r2sev.com" data-remove-prefix />

                                        <div class="hp" aria-hidden="true">
                                            <label>Dieses Feld bitte leer lassen: <input type="text" name="bot-field" tabindex="-1" autocomplete="off" /></label>
                                        </div>

                                        <div class="field">
                                            <label for="f-name">Name</label>
                                            <input
                                                id="f-name"
                                                name="name"
                                                type="text"
                                                autocomplete="name"
                                                placeholder="Wie heisst du?"
                                                maxlength="100"
                                                required
                                            />
                                            <p class="field__error" id="f-name-error" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label for="f-email">E-Mail</label>
                                            <input
                                                id="f-email"
                                                name="email"
                                                type="email"
                                                inputmode="email"
                                                autocomplete="email"
                                                autocapitalize="off"
                                                spellcheck="false"
                                                placeholder="damit ich dir antworten kann"
                                                maxlength="200"
                                                required
                                            />
                                            <p class="field__error" id="f-email-error" hidden></p>
                                        </div>

                                        <div class="field">
                                            <label for="f-message">Nachricht</label>
                                            <textarea id="f-message" name="message" rows="5" placeholder="Worum geht's?" maxlength="4000" required></textarea>
                                            <p class="field__error" id="f-message-error" hidden></p>
                                        </div>

                                        <button class="submit" type="submit" data-submit>
                                            <span data-submit-label>Nachricht senden</span>
                                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                                <path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z" />
                                            </svg>
                                        </button>

                                        <p class="form__status" role="alert" data-form-status hidden></p>
                                        <p class="form__note">Deine Angaben werden nur verwendet, um dir zu antworten.</p>
                                    </form>

                                    <div class="success" tabindex="-1" data-contact-success hidden>
                                        <span class="success__icon" aria-hidden="true">
                                            <svg viewBox="0 0 24 24" focusable="false"><path d="M20 6 9 17l-5-5" /></svg>
                                        </span>
                                        <h2 class="success__title">Danke für deine Nachricht!</h2>
                                        <p class="success__text">Sie ist angekommen. Ich melde mich so bald wie möglich bei dir.</p>
                                        <button class="text-button" type="button" data-contact-again>Weitere Nachricht schreiben</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </main>
    </body>
</html>
